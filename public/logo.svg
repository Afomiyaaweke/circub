<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" fill="none">
  <defs>
    <linearGradient id="cGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="cubeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BBF7D0"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
  </defs>

  <!-- 3D "C" shape (left) -->
  <path d="M44 8 C22 8 6 22 6 32 C6 42 22 56 44 56 L46 46 C30 46 18 38 18 32 C18 26 30 18 46 18 Z" fill="url(#cGradient)"/>
  <!-- Inner shadow curve -->
  <path d="M44 16 C30 16 20 24 20 32 C20 40 30 48 44 48 L46 38 C36 38 30 34 30 32 C30 30 36 22 46 22 Z" fill="#166534" opacity="0.35"/>

  <!-- 3D isometric cube accent (top-right of C) -->
  <g transform="translate(42 8)">
    <!-- Top face -->
    <path d="M8 0 L16 4 L8 8 L0 4 Z" fill="url(#cubeTop)"/>
    <!-- Left face -->
    <path d="M0 4 L8 8 L8 16 L0 12 Z" fill="url(#cubeGradient)"/>
    <!-- Right face -->
    <path d="M16 4 L8 8 L8 16 L16 12 Z" fill="url(#cubeRight)"/>
  </g>

  <!-- Wordmark "circub" with cube as the i-dot -->
  <g transform="translate(72 38)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-weight="800" font-size="28" letter-spacing="-1">
    <text x="0" y="0" fill="#14532D">c</text>
    <!-- "i" without dot -->
    <text x="14" y="0" fill="#14532D">i</text>
    <!-- cube as the i dot -->
    <g transform="translate(18 -22)">
      <path d="M3 0 L6 1.5 L3 3 L0 1.5 Z" fill="url(#cubeTop)"/>
      <path d="M0 1.5 L3 3 L3 6 L0 4.5 Z" fill="url(#cubeGradient)"/>
      <path d="M6 1.5 L3 3 L3 6 L6 4.5 Z" fill="url(#cubeRight)"/>
    </g>
    <text x="22" y="0" fill="#14532D">rcub</text>
  </g>
</svg>
